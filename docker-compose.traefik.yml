# Connect the bridge to the same Docker network as Traefik.
#   docker network ls
#   # set TRAEFIK_NETWORK in .env to that name, then:
#   docker compose -f docker-compose.yml -f docker-compose.traefik.yml up -d

services:
  nginx:
    networks:
      - default
      - traefik

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-proxy}
