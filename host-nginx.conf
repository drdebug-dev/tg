# Add this vhost to the nginx that already owns ports 80/443 on the VPS.
# Replace tg-api.example.com and ssl_certificate paths with yours.
#
# Docker nginx (same host, e.g. faktoos_nginx):
#   docker network connect <that_nginx_network> telegram-bridge
#   then use: proxy_pass http://telegram-bridge:80;
#
# Host nginx (installed on the VPS, not Docker):
#   keep: proxy_pass http://127.0.0.1:8089;

server {
    listen 80;
    server_name tg-api.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name tg-api.example.com;

    # ssl_certificate     /etc/letsencrypt/live/tg-api.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/tg-api.example.com/privkey.pem;

    access_log off;
    client_max_body_size 50m;
    client_body_timeout 120s;

    # Optional: only the Iranian app host
    # allow 203.0.113.10;
    # deny all;

    location / {
        proxy_pass              http://127.0.0.1:8089;
        proxy_http_version      1.1;
        proxy_set_header        Connection "";
        proxy_set_header        Host $host;
        proxy_set_header        X-Real-IP $remote_addr;
        proxy_connect_timeout   30s;
        proxy_send_timeout      120s;
        proxy_read_timeout      120s;
        proxy_buffering         off;
        proxy_request_buffering off;
        proxy_redirect          off;
    }
}
