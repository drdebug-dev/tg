# Add this vhost only if the VPS edge is nginx (not Traefik).
# For Traefik + dg.pingol.ir see README.md and docker-compose.traefik.yml.
#
# Docker nginx:
#   docker network connect <that_nginx_network> telegram-bridge
#   then use: proxy_pass http://telegram-bridge:80;
#
# Host nginx:
#   keep: proxy_pass http://127.0.0.1:8089;

server {
    listen 80;
    server_name dg.pingol.ir;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name dg.pingol.ir;

    # ssl_certificate     /etc/letsencrypt/live/dg.pingol.ir/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/dg.pingol.ir/privkey.pem;

    access_log off;
    client_max_body_size 50m;
    client_body_timeout 120s;

    # Optional: only the Iranian app host
    # allow 203.0.113.10;
    # deny all;

    location / {
        proxy_pass              http://127.0.0.1:8089;
        proxy_http_version      1.1;
        proxy_set_header        Connection "";
        proxy_set_header        Host $host;
        proxy_set_header        X-Real-IP $remote_addr;
        proxy_connect_timeout   30s;
        proxy_send_timeout      120s;
        proxy_read_timeout      120s;
        proxy_buffering         off;
        proxy_request_buffering off;
        proxy_redirect          off;
    }
}
