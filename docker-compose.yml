# ============================================================
#  Telegram Bot API bridge — run on a foreign VPS that already
#  has nginx (or other apps) on ports 80/443.
#
#  Default: HTTP on 127.0.0.1:8089 (does not take 80/443).
#  Put a vhost on your existing nginx — see host-nginx.conf
#
#  Iranian app: TELEGRAM_API_BASE=https://<BRIDGE_DOMAIN>
# ============================================================

services:
  nginx:
    build: .
    container_name: telegram-bridge
    environment:
      BRIDGE_DOMAIN: ${BRIDGE_DOMAIN:?Set BRIDGE_DOMAIN in .env}
      BEHIND_PROXY: ${BEHIND_PROXY:-1}
      ALLOW_IRAN_IP: ${ALLOW_IRAN_IP:-}
    ports:
      # Avoid clashing with the VPS nginx on :80 / :443
      - "${BRIDGE_BIND:-127.0.0.1}:${BRIDGE_PORT:-8089}:80"
    restart: unless-stopped
