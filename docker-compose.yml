# ============================================================
#  Telegram Bot API bridge — foreign VPS (dg.pingol.ir)
#
#  Iranian app: TELEGRAM_API_BASE=https://dg.pingol.ir
#
#  This VPS already has Traefik on 80/443. Do not bind those ports.
#  After up: docker network connect <traefik_network> telegram-bridge
# ============================================================

services:
  nginx:
    build: .
    container_name: telegram-bridge
    environment:
      BRIDGE_DOMAIN: ${BRIDGE_DOMAIN:-dg.pingol.ir}
      BEHIND_PROXY: ${BEHIND_PROXY:-1}
      ALLOW_IRAN_IP: ${ALLOW_IRAN_IP:-}
    ports:
      - "${BRIDGE_BIND:-127.0.0.1}:${BRIDGE_PORT:-8089}:80"
    labels:
      - traefik.enable=true
      - traefik.http.routers.tg-bridge.rule=Host(`${BRIDGE_DOMAIN:-dg.pingol.ir}`)
      - traefik.http.routers.tg-bridge.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.tg-bridge.tls=true
      - traefik.http.routers.tg-bridge.service=tg-bridge
      - traefik.http.services.tg-bridge.loadbalancer.server.port=80
      - traefik.http.services.tg-bridge.loadbalancer.passHostHeader=true
    restart: unless-stopped
