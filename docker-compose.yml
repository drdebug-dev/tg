# ============================================================
#  Telegram Bot API bridge — run this on a foreign VPS.
#  Iranian app sets TELEGRAM_API_BASE=https://<BRIDGE_DOMAIN>
#
#  First time:
#    1. cp .env.example .env  → set BRIDGE_DOMAIN and CERTBOT_EMAIL
#    2. Point DNS A record of BRIDGE_DOMAIN to this VPS
#    3. docker compose up -d nginx
#    4. docker compose run --rm --entrypoint certbot certbot certonly \
#         --webroot -w /var/www/certbot -d "$BRIDGE_DOMAIN" \
#         --email "$CERTBOT_EMAIL" --agree-tos --no-eff-email
#    5. docker compose restart nginx
# ============================================================

services:
  nginx:
    build: .
    container_name: telegram-bridge
    environment:
      BRIDGE_DOMAIN: ${BRIDGE_DOMAIN:?Set BRIDGE_DOMAIN in .env}
      ALLOW_IRAN_IP: ${ALLOW_IRAN_IP:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    restart: unless-stopped

  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    entrypoint: /bin/sh
    command:
      - -c
      - trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h; done
    restart: unless-stopped

volumes:
  certbot_www:
  certbot_conf:
